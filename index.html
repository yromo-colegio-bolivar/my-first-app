
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clics - Colegio Bolívar</title>

    <style>
        /* Estilos generales - Dark Mode */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #071426, #102b4e);
            color: #f0f6ff;
            text-align: center;
            padding: 20px;
        }

        /* Encabezado */
        header {
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #00f5ff;
            text-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
        }

        header h2 {
            font-size: 1.3rem;
            font-weight: 400;
            color: #b8cce4;
        }

        /* Tarjeta principal */
        main {
            width: 100%;
            max-width: 450px;
            padding: 35px 30px;
            background: rgba(16, 35, 63, 0.95);
            border: 1px solid #24496d;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        /* Campo de texto */
        .campo-evento {
            margin-bottom: 25px;
            text-align: left;
        }

        .campo-evento label {
            display: block;
            margin-bottom: 10px;
            color: #b8cce4;
            font-size: 0.95rem;
        }

        #nombreEvento {
            width: 100%;
            padding: 14px;
            border: 2px solid #24496d;
            border-radius: 10px;
            background: #071426;
            color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #nombreEvento:focus {
            border-color: #00f5ff;
            box-shadow: 0 0 12px rgba(0, 245, 255, 0.3);
        }

        /* Título dinámico */
        #tituloEvento {
            font-size: 1.6rem;
            color: #ffffff;
            margin: 20px 0;
            overflow-wrap: anywhere;
        }

        /* Número del contador */
        #contador {
            font-size: 6rem;
            font-weight: bold;
            color: #00ffb3;
            margin: 25px 0;
            text-shadow: 0 0 25px rgba(0, 255, 179, 0.6);
        }

        /* Botones */
        button {
            width: 100%;
            padding: 16px 24px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Botón incrementar */
        #btnContar {
            background: #00f5ff;
            color: #061426;
            box-shadow: 0 0 18px rgba(0, 245, 255, 0.45);
        }

        #btnContar:hover {
            background: #67ffff;
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.8);
        }

        /* Botón reiniciar */
        #btnReiniciar {
            background: transparent;
            color: #ff6b9a;
            border: 2px solid #ff6b9a;
        }

        #btnReiniciar:hover {
            background: #ff6b9a;
            color: #071426;
            box-shadow: 0 0 20px rgba(255, 107, 154, 0.5);
            transform: translateY(-3px);
        }

        button:active {
            transform: scale(0.97);
        }

        button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

        /* Pie de página */
        footer {
            margin-top: 35px;
            font-size: 0.85rem;
            color: #91a9c4;
        }

        /* Diseño responsive */
        @media (max-width: 480px) {
            header h1 {
                font-size: 2rem;
            }

            main {
                padding: 25px 20px;
            }

            #contador {
                font-size: 5rem;
            }

            #tituloEvento {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Colegio Bolívar</h1>
        <h2>Contador de Clics para Eventos</h2>
    </header>

    <main>

        <!-- Campo para modificar el título -->
        <div class="campo-evento">
            <label for="nombreEvento">
                Nombre del evento:
            </label>

            <input
                type="text"
                id="nombreEvento"
                placeholder="Escribe el nombre del evento"
                value="Evento Colegio Bolívar"
                oninput="actualizarTitulo()"
            >
        </div>

        <!-- Título que cambia en tiempo real -->
        <h2 id="tituloEvento">Evento Colegio Bolívar</h2>

        <p>Haz clic para registrar una participación.</p>

        <!-- Contador -->
        <div id="contador" aria-live="polite">0</div>

        <!-- Botón incrementar -->
        <button id="btnContar" onclick="incrementarContador()">
            + Agregar clic
        </button>

        <!-- Botón reiniciar -->
        <button id="btnReiniciar" onclick="reiniciarContador()">
            Reiniciar Contador
        </button>

    </main>

    <footer>
        <p>Colegio Bolívar - Cali, Colombia</p>
    </footer>

    <script>
        // Variable que almacena los clics
        let clics = 0;

        // Incrementar el contador
        function incrementarContador() {
            clics++;

            document.getElementById("contador").textContent = clics;
        }

        // Reiniciar el contador a cero
        function reiniciarContador() {
            clics = 0;

            document.getElementById("contador").textContent = clics;
        }

        // Actualizar el título mientras el usuario escribe
        function actualizarTitulo() {
            const nombre = document.getElementById("nombreEvento").value;

            document.getElementById("tituloEvento").textContent =
                nombre.trim() === "" ? "Evento sin título" : nombre;
        }
    </script>

</body>
</html>
